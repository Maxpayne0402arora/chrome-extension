<script>
"use strict";
/* ============================================================ utils */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = v => v == null ? "–" : `${v}%`;
const stars = v => v == null ? "–" : `${v}★`;
const signed = v => v == null ? "–" : (v > 0 ? "+" : "") + v;
const mom = m => m == null ? "–" : m >= 1.25 ? `↑ ${m}×` : m <= 0.8 ? `↓ ${m}×` : `${m}×`;
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const slugify = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "x";
const safeUrl = u => typeof u === "string" && u.startsWith("https://") ? u : null;
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
document.addEventListener("mousemove", e => {
  const t = e.target.closest?.("[data-tip]"), tip = $("#tip");
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + "px"; tip.style.top = (e.clientY + 14) + "px";
});

/* ============================================================ engine: sentiment (for uploads without stars/labels) */
const LEX = (() => {
  const m = {};
  const add = (w, s) => w.split(" ").forEach(x => m[x] = s);
  add("worst pathetic horrible terrible scam fraud useless disgusting cheated cheating fake pathetic", -3);
  add("bad poor awful worse rude never refund delayed delay broken damaged expired stuck crash crashes crashing crashed fails failed failure error wrong missing lost waste wasted annoying frustrating frustrated disappointed disappointing unacceptable irritating unprofessional cheat duplicate defective harassment issue issues problem problems complaint complain slow lag hang hangs nobody pending", -2);
  add("hate angry hidden expensive costly overpriced difficult confusing spam unable cannot cant can't don't didn't doesn't won't not", -1);
  add("good nice fine okay ok helpful easy fast quick smooth genuine reliable polite resolved affordable convenient", 2);
  add("great excellent amazing awesome love loved best perfect superb fantastic wonderful happy satisfied recommend", 3);
  ["not","cant","can't","don't","didn't","doesn't","won't","cannot","never","no"].forEach(w => m[w] = m[w] ?? 0);
  return m;
})();
const NEGATORS = new Set(["not","no","never","dont","don't","didnt","didn't","doesnt","doesn't","cant","can't","cannot","wont","won't","isnt","isn't","wasnt","wasn't","without"]);
function textSentiment(t) {
  const w = t.toLowerCase().match(/[a-z']+/g) || [];
  let s = 0;
  w.forEach((x, i) => {
    let v = LEX[x]; if (!v || NEGATORS.has(x)) return;
    if (w.slice(Math.max(0, i - 3), i).some(p => NEGATORS.has(p))) v = -v * 0.75;
    s += v;
  });
  if (/!{2,}/.test(t)) s *= 1.15;
  return s / Math.sqrt(s * s + 15);
}

/* ============================================================ engine: taxonomy + preparation */
let TAX = null;
const rx = list => new RegExp(list.map(p => `(?:${p})`).join("|"), "i");
function buildTax(sector) {
  const t = {};
  for (const [k, v] of Object.entries(TAX.core)) t[k] = [...v];
  for (const s of String(sector || "").split(",").map(x => x.trim()).filter(Boolean))
    for (const [k, v] of Object.entries(TAX.sectors[s] || {})) (t[k] = t[k] || []).push(...v);
  return Object.fromEntries(Object.entries(t).map(([k, v]) => [k, rx(v)]));
}
const COLS = {
  text: ["text","review","content","body","comment","feedback","message","review_text","comment_text"],
  date: ["date","at","created_at","timestamp","review_date","time","updated"],
  rating: ["rating","score","stars","star_rating"],
  title: ["title","subject","headline"],
  source: ["source","channel","platform"],
  likes: ["likes","thumbsupcount","thumbs_up","upvotes","helpful","votes"],
  version: ["version","reviewcreatedversion","appversion","app_version"],
  url: ["url","link","permalink"],
  sentiment: ["sentiment"], label: ["label"],
};
function normalizeRows(records, defaultSource) {
  if (!records.length) return [];
  const keys = Object.keys(records[0]);
  const lower = Object.fromEntries(keys.map(k => [k.toLowerCase().trim(), k]));
  const pick = opts => { for (const o of opts) if (lower[o]) return lower[o]; return null; };
  const c = Object.fromEntries(Object.entries(COLS).map(([k, v]) => [k, pick(v)]));
  if (!c.text) throw new Error(`No text column found. Name one of your columns: ${COLS.text.slice(0, 6).join(", ")}.`);
  return records.map(r => {
    const rating = c.rating ? parseFloat(r[c.rating]) : NaN;
    const sent = c.sentiment ? parseFloat(r[c.sentiment]) : NaN;
    return {
      text: [c.title ? r[c.title] : "", r[c.text]].filter(Boolean).join(". "),
      source: (c.source && String(r[c.source] || "").trim()) || defaultSource,
      date: c.date ? normDate(r[c.date]) : null,
      rating: rating >= 1 && rating <= 5 ? rating : null,
      likes: c.likes ? Math.max(0, parseInt(r[c.likes]) || 0) : 0,
      version: c.version ? (String(r[c.version] || "").trim() || null) : null,
      url: c.url ? safeUrl(r[c.url]) : null,
      sentiment: Number.isFinite(sent) ? sent : null,
    };
  }).filter(r => r.text && r.text.length >= 12);
}
function normDate(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return new Date(v < 1e12 ? v * 1000 : v).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  const d = new Date(s); return isNaN(d) ? null : d.toISOString().slice(0, 10);
}
function prepare(rows, opts) {
  const tax = buildTax(opts.sector);
  const churn = rx(TAX.churn), fr = rx(TAX.feature_request);
  const seen = new Set(), out = [];
  for (const r of rows) {
    const text = String(r.text).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    const key = r.source + "|" + text + "|" + (r.date || "");
    if (seen.has(key)) continue; seen.add(key);
    const ts = r.sentiment != null ? r.sentiment : textSentiment(text);
    const sentiment = r.sentiment != null ? r.sentiment : (r.rating != null ? 0.35 * ts + 0.65 * (r.rating - 3) / 2 : ts);
    out.push({...r, text, sentiment: r2(sentiment),
      label: sentiment <= -0.15 ? "negative" : sentiment >= 0.15 ? "positive" : "neutral",
      month: r.date ? r.date.slice(0, 7) : null,
      areas: Object.entries(tax).filter(([, re]) => re.test(text)).map(([k]) => k),
      churn: churn.test(text), fr: fr.test(text)});
  }
  return out;
}

/* ============================================================ engine: analysis */
const STOP = new Set(("a about above across after afterwards again against all almost alone along already also although always am among amongst amount an and another any anyhow anyone anything anyway anywhere are around as at back be became because become becomes becoming been before beforehand behind being below beside besides between beyond both bottom but by call can cannot cant could couldnt de describe detail do does doing done down due during each eg eight either eleven else elsewhere empty enough etc even ever every everyone everything everywhere except few fifteen fifty fill find fire first five for former formerly forty found four from front full further get give go had has hasnt have he hence her here hereafter hereby herein hereupon hers herself him himself his how however hundred i ie if in inc indeed interest into is it its itself keep last latter latterly least less ltd made many may me meanwhile might mill mine more moreover most mostly move much must my myself name namely neither never nevertheless next nine no nobody none noone nor not nothing now nowhere of off often on once one only onto or other others otherwise our ours ourselves out over own part per perhaps please put rather re same see seem seemed seeming seems serious several she should show side since sincere six sixty so some somehow someone something sometime sometimes somewhere still such system take ten than that the their them themselves then thence there thereafter thereby therefore therein thereupon these they thick thin third this those though three through throughout thru thus to together too top toward towards twelve twenty two un under until up upon us very via was we well were what whatever when whence whenever where whereafter whereas whereby wherein whereupon wherever whether which while whither who whoever whole whom whose why will with within without would yet you your yours yourself yourselves " +
  "app apps good nice bad worst best use using just like really dont don didn doesn im ve ll time also get got isn wasn won aren hai ki ka ke ko se na nahi").split(" "));
function grams(item, stopExtra) {
  if (item._g) return item._g;
  const toks = (item.text.toLowerCase().match(/[a-z][a-z]+/g) || []).filter(w => !STOP.has(w) && !stopExtra.has(w));
  const g = new Set();
  for (let n = 1; n <= 3; n++) for (let i = 0; i + n <= toks.length; i++) g.add(toks.slice(i, i + n).join(" "));
  return item._g = g;
}
function docFreq(items, stopExtra, minN = 1, maxN = 3) {
  const m = new Map();
  items.forEach((it, idx) => grams(it, stopExtra).forEach(g => {
    const n = g.split(" ").length; if (n < minN || n > maxN) return;
    let a = m.get(g); if (!a) m.set(g, a = []); a.push(idx);
  }));
  return m;
}
function logOdds(A, B, stopExtra, minN, maxN) {
  const fa = docFreq(A, stopExtra, minN, maxN), fb = docFreq(B, stopExtra, minN, maxN);
  let na = 0, nb = 0; fa.forEach(v => na += v.length); fb.forEach(v => nb += v.length);
  const keys = new Set([...fa.keys(), ...fb.keys()]), out = [];
  for (const k of keys) {
    const a = (fa.get(k)?.length || 0) + .5, b = (fb.get(k)?.length || 0) + .5;
    const z = ((Math.log(a) - Math.log(na)) - (Math.log(b) - Math.log(nb))) / Math.sqrt(1 / a + 1 / b);
    out.push({phrase: k, z: r1(z), a: Math.round(a - .5), b: Math.round(b - .5)});
  }
  return out;
}
const collapse = (rows, n) => { const kept = []; for (const r of rows) { if (kept.some(k => k.phrase.includes(r.phrase) || r.phrase.includes(k.phrase))) continue; kept.push(r); if (kept.length === n) break; } return kept; };
function momentum(subNeg, allNeg, days = 30) {
  const dates = allNeg.map(x => x.date).filter(Boolean).sort();
  if (!dates.length) return 1;
  const end = new Date(dates[dates.length - 1]); end.setDate(end.getDate() - days);
  const cut = end.toISOString().slice(0, 10);
  const totR = dates.filter(d => d > cut).length, totO = dates.length - totR;
  if (totR < 10 || totO < 10) return 1;
  const sd = subNeg.map(x => x.date).filter(Boolean);
  const r = sd.filter(d => d > cut).length / totR, o = sd.filter(d => d <= cut).length / totO;
  if (!o) return r ? 2 : 1;
  return r2(Math.min(2, Math.max(.5, r / o)));
}
function quotes(items, n = 4) {
  const seen = new Set(), long = items.filter(x => x.text.length >= 40), base = long.length ? long : items;
  return [...base].sort((a, b) => b.likes - a.likes || a.sentiment - b.sentiment).filter(x => !seen.has(x.text) && seen.add(x.text)).slice(0, n);
}
function analyse(items, ds) {
  const company = ds.name, comps = String(ds.competitors || "").split(",").map(s => s.trim()).filter(Boolean);
  const stopExtra = new Set(company.toLowerCase().match(/[a-z]+/g) || []);
  const neg = items.filter(x => x.label === "negative"), nNeg = Math.max(neg.length, 1);
  const rated = items.filter(x => x.rating != null), overall = mean(rated.map(x => x.rating));
  const areaNames = [...new Set(items.flatMap(x => x.areas))];
  let areas = areaNames.map(a => {
    const sub = items.filter(x => x.areas.includes(a)), sn = neg.filter(x => x.areas.includes(a));
    if (sub.length < 3) return null;
    const sr = sub.filter(x => x.rating != null).map(x => x.rating);
    const share = sn.length / nNeg, sev = sn.length ? -mean(sn.map(x => x.sentiment)) : 0;
    const m = momentum(sn, neg, 30), reach = 1 + Math.log10(1 + (mean(sn.map(x => x.likes)) || 0));
    return {area: a, mentions: sub.length, negative_mentions: sn.length, pct_of_all_complaints: r1(100 * share),
      negative_rate: r1(100 * sn.length / sub.length), severity: r2(sev), momentum: m, reach: r2(reach),
      avg_rating: sr.length ? r2(mean(sr)) : null, rating_drag: sr.length && overall != null ? r2(mean(sr) - overall) : null,
      churn_mentions: sn.filter(x => x.churn).length, raw: share * sev * m * reach, quotes: quotes(sn)};
  }).filter(Boolean);

const S = {db: null, assets: null, sample: null, datasets: [], topics: [], cache: {}, cur: store.get("radar.cur") || "example", local: {}, dbState: "loading"};

async function loadDataset(id) {

  if (!ds) throw new Error("That dataset is no longer available.");
  let rows;
  if (ds.example) rows = (await (await fetch("example.json")).json()).rows;
  else if (ds.rows) rows = ds.rows;
  else { const r = await fetch(ds.assetId ? "/_blob/" + ds.assetId : ds.url); if (!r.ok) throw new Error("Could not load this dataset's file."); rows = (await r.json()).rows; }

async function initCapabilities() {
  const c = window.claude;
  if (!c?.use) { S.dbState = "none"; S.topics = store.get("radar.topics") || []; route(); return; }
  const [db, assets, sample] = await Promise.all([c.use("db"), c.use("assets"), c.use("sample")]);
  S.db = db; S.assets = assets; S.sample = sample;
  if (!db) { S.dbState = "none"; S.topics = store.get("radar.topics") || []; route(); return; }
  const timer = setTimeout(() => { S.dbState = "slow"; route(); }, 10000);
  db.collection("datasets").onSnapshot(snap => {
    clearTimeout(timer); S.dbState = "ok";
    S.datasets = snap.docs.filter(d => d.exists).map(d => ({id: d.id, ...d.data()})).sort((a, b) => String(b.uploadedAt).localeCompare(String(a.uploadedAt)));
    if (["", "brands", "compare"].includes(location.hash.slice(1))) route();

  db.collection("topics").onSnapshot(snap => {
    S.topics = snap.docs.filter(d => d.exists).map(d => ({id: d.id, ...d.data()}));
    if (location.hash === "#topic" && !document.activeElement?.closest?.("#ct")) route();
  }, () => {});

}

  const W = 560, H = 180, L = 38, R = 10, T = 10, B = 24;

  const step = Math.max(1, Math.ceil(points.length / 5)), last = points.length - 1;
  const xl = points.map((p, i) => ((i % step === 0 && last - i >= step / 2) || i === last) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === last ? "end" : "middle"}">${esc(p.month)}</text>` : "").join("");

      <span class="meta">${canSave ? "Saved so everyone with this link can open it." : "Analysed in your browser for this session. Saving for others needs edit access on claude.ai."}</span></div>
    <p id="umsg" class="meta" aria-live="polite"></p>
  </form></div>
  <details style="margin-top:16px"><summary>How do I get review files?</summary><div class="card" style="font-size:14px">
    <p style="margin-top:0"><b>Fastest:</b> run the Python version of this tool on your laptop (<code>python -m radar analyze "Nykaa"</code>). It downloads Play Store, App Store, Reddit and Hacker News feedback automatically. Upload the <code>out/nykaa/feedback_tagged.csv</code> it writes.</p>
    <p><b>By hand:</b> export or copy reviews from Trustpilot, MouthShut, X, YouTube comments, consumer complaint portals, or your own support tool into a spreadsheet with a <code>text</code> column, then save as CSV.</p>
    <p style="margin-bottom:0">This page can't download reviews itself: pages hosted on claude.ai aren't allowed to fetch other websites.</p></div></details>`;

  $("#app").querySelectorAll("[data-ds]").forEach(el => { el.onclick = () => openDataset(el.dataset.ds); el.onkeydown = e => { if (e.key === "Enter") openDataset(el.dataset.ds); }; });

  $("#qf").onsubmit = e => { e.preventDefault(); state.quickBrand = $("#qbrand").value.trim(); state.quickResult = null; location.hash = "quick"; };
  $("#uf").onsubmit = async e => {
    e.preventDefault();
    const msg = $("#umsg"), btn = e.target.querySelector("button[type=submit]");
    const name = $("#ub").value.trim(), sector = [...document.querySelectorAll("[name=sec]:checked")].map(c => c.value).join(",");
    btn.disabled = true; msg.innerHTML = `<span class="spinner"></span>Reading files…`;
    try {
      let rows = [];
      for (const f of $("#uff").files) {
        const txt = await f.text(), srcName = f.name.replace(/\.[^.]+$/, "");
        let recs;
        if (/\.json$/i.test(f.name)) { const j = JSON.parse(txt); recs = Array.isArray(j) ? j : (j.rows || j.items || []); }
        else recs = Papa.parse(txt, {header: true, skipEmptyLines: true}).data;
        rows.push(...normalizeRows(recs, srcName));
      }
      if (rows.length < 20) throw new Error(`Only ${rows.length} usable rows found. Check that the file has a text column with the reviews.`);
      const meta = {name, sector, competitors: $("#uc").value.trim(), n: rows.length, uploadedAt: new Date().toISOString()};
      if (canSave) {
        msg.innerHTML = `<span class="spinner"></span>Saving ${rows.length.toLocaleString()} rows…`;
        const blob = new Blob([JSON.stringify({rows})], {type: "application/json"});
        const up = await S.assets.upload(blob, {type: "application/json"});
        const ref = await S.db.collection("datasets").add({...meta, assetId: up.id});
        S.cache[ref.id] = null;
        S.datasets = [{id: ref.id, ...meta, assetId: up.id}, ...S.datasets.filter(d => d.id !== ref.id)];
        openDataset(ref.id);
      } else {
        const id = "local-" + slugify(name) + "-" + Date.now();
        S.local[id] = {id, ...meta, rows}; openDataset(id);
      }
    } catch (err) { msg.innerHTML = `<span class="err">${esc(err.message || err.code || err)}</span>`; btn.disabled = false; }
  };
}

  td.querySelectorAll("[data-goto]").forEach(el => el.onclick = () => { state.topicDef = {topic: el.dataset.goto}; state.filter = {}; topicView(); });
  if ($("#ask")) $("#ask").onclick = async () => {
    const neg = filterFeedback(D, {...def, ...F, sentiment: "negative", sort: "helpful"}).slice(0, 60);
    if (neg.length < 5) { $("#claude").innerHTML = `<p class="meta">Claude needs at least 5 negative comments in this selection.</p>`; return; }
    $("#ask").disabled = true; $("#claude").innerHTML = `<p class="meta"><span class="spinner"></span>Claude is reading ${neg.length} comments… (20–60 seconds)</p>`;
    const label = d.topic + (F.subtheme ? " / " + F.subtheme : F.phrase ? ` / "${F.phrase}"` : "");
    const prompt = `You are helping a product manager find problems worth solving at ${D.ds.name}. Below are ${neg.length} negative user comments about "${label}". Some may be off-topic; ignore those.
Group them into 2-5 distinct, specific pain points. Use only what the comments say; do not invent facts. Mark the root cause as a hypothesis.
Reply with only JSON in this shape: ${PAIN_SCHEMA}

Comments:
${neg.map(x => "- " + x.text.slice(0, 500)).join("\n")}`;
    try { $("#claude").innerHTML = `<div class="card" style="margin:0 0 12px">${painBlock(await S.sample.json(prompt))}</div>`; }
    catch (e) { $("#claude").innerHTML = `<p class="err">${esc(claudeError(e))}</p>`; }
    $("#ask").disabled = false;
  };
  feedbackPanel(D, {...def, ...F}, () => { state.filter = {}; renderTopic(D); });
}

/* ============================================================ feedback list */
function feedbackPanel(D, base, clear) {
  const F = {sentiment: "", source: "", sort: "helpful", q: "", shown: 25};
  const sources = [...new Set(D.items.map(x => x.source))].sort();
  const active = [base.subtheme && `Sub-theme: ${base.subtheme}`, base.phrase && `Phrase: “${base.phrase}”`].filter(Boolean);
  $("#fbpanel").innerHTML = `<div class="row">
    ${active.map(a => `<span class="chip on clr" tabindex="0" data-tip="Clear this filter">${esc(a)} ✕</span>`).join("")}
    <input type="text" id="fq" placeholder="Search within…" aria-label="Search feedback" style="flex:1 1 160px">
    <select id="fs" aria-label="Sentiment"><option value="">All sentiment</option><option value="negative">Negative</option><option value="neutral">Neutral</option><option value="positive">Positive</option></select>
    <select id="fsrc" aria-label="Source"><option value="">All sources</option>${sources.map(s => `<option>${esc(s)}</option>`).join("")}</select>
    <select id="fsort" aria-label="Sort"><option value="helpful">Most agreed with</option><option value="recent">Most recent</option><option value="negative">Most negative</option><option value="positive">Most positive</option></select>
    <span class="meta" id="fcount"></span></div><div id="fblist" style="margin-top:8px"></div>
    <div class="row" style="justify-content:center;margin-top:8px"><button id="more" hidden>Show more</button></div>`;
  $("#fbpanel").querySelectorAll(".clr").forEach(c => c.onclick = clear);
  const draw = () => {
    const all = filterFeedback(D, {...base, sentiment: F.sentiment, source: F.source, sort: F.sort, q: F.q});
    $("#fcount").textContent = `${all.length.toLocaleString()} matching`;
    $("#fblist").innerHTML = all.slice(0, F.shown).map(i => fbItem(i, [base.phrase, F.q])).join("") || `<div class="empty">No matching feedback.</div>`;
    $("#more").hidden = F.shown >= all.length;
  };
  let t; $("#fq").oninput = e => { clearTimeout(t); t = setTimeout(() => { F.q = e.target.value.trim(); F.shown = 25; draw(); }, 250); };
  $("#fs").onchange = e => { F.sentiment = e.target.value; F.shown = 25; draw(); };
  $("#fsrc").onchange = e => { F.source = e.target.value; F.shown = 25; draw(); };
  $("#fsort").onchange = e => { F.sort = e.target.value; draw(); };
  $("#more").onclick = () => { F.shown += 25; draw(); };
  draw();
}

/* ============================================================ ALL FEEDBACK */
async function feedbackView() {
  nav("feedback");
  const D = await loadDataset(S.cur); nav("feedback");
  const phrase = state.explorePhrase; state.explorePhrase = null;
  $("#app").innerHTML = `<h1>All feedback: ${esc(D.ds.name)}</h1><p class="sub">Search and filter everything in this dataset.</p>
    <div class="card"><div class="row" style="margin-bottom:8px"><select id="ftopic" aria-label="Topic"><option value="">All topics</option>${D.summary.areas.map(a => `<option>${esc(a.area)}</option>`).join("")}</select></div><div id="fbpanel"></div></div>`;
  const go = (topic, ph) => feedbackPanel(D, {topic: topic || null, phrase: ph || null}, () => go($("#ftopic").value, null));
  $("#ftopic").onchange = e => go(e.target.value, null);
  go(null, phrase);
}

/* ============================================================ COMPARE */
async function compareView() {
  nav("compare");
  const list = allDatasets();
  const picked = new Set(store.get("radar.cmp") || list.map(d => d.id));
  $("#app").innerHTML = `<h1>Compare brands</h1><p class="sub">Where is each brand weak? Each cell is the share of that brand's complaints that mention the topic. Click a cell to deep-dive.</p>
    <div class="card">${list.map(d => `<label class="ck"><input type="checkbox" value="${esc(d.id)}" ${picked.has(d.id) ? "checked" : ""}>${esc(d.name)}</label>`).join("")}
    ${list.length < 2 ? `<p class="meta">Add at least one more brand on the Brands page to compare.</p>` : ""}</div><div id="cmp"></div>`;
  const draw = async () => {
    const ids = [...$("#app").querySelectorAll("input:checked")].map(c => c.value); store.set("radar.cmp", ids);
    if (ids.length < 1) { $("#cmp").innerHTML = ""; return; }
    $("#cmp").innerHTML = `<div class="empty"><span class="spinner"></span>Loading…</div>`;
    const Ds = await Promise.all(ids.map(loadDataset)), sums = Ds.map(d => d.summary);
    const by = sums.map(s => Object.fromEntries(s.areas.map(a => [a.area, a])));
    const areas = [...new Set(sums.flatMap(s => s.areas.map(a => a.area)))].sort((a, b) => Math.max(...by.map(x => x[b]?.pct_of_all_complaints || 0)) - Math.max(...by.map(x => x[a]?.pct_of_all_complaints || 0)));
    $("#cmp").innerHTML = `<div class="card scroll"><table><thead><tr><th>Brand</th><th class="num">Items</th><th class="num">Avg ★</th><th class="num">Negative</th><th class="num">Net</th></tr></thead><tbody>
      ${sums.map((s, i) => `<tr class="click" data-open="${esc(ids[i])}"><td><b>${esc(s.company)}</b></td><td class="num">${s.n.toLocaleString()}</td><td class="num">${stars(s.avg_rating)}</td><td class="num">${s.pct_negative}%</td><td class="num">${signed(s.net)}</td></tr>`).join("")}</tbody></table></div>
      <h2>Complaint mix by topic</h2><div class="card scroll"><table><thead><tr><th>Topic</th>${sums.map(s => `<th class="num">${esc(s.company)}</th>`).join("")}</tr></thead><tbody>
      ${areas.map(a => `<tr><td>${esc(a)}</td>${by.map((b, i) => { const v = b[a]?.pct_of_all_complaints; return v == null ? `<td class="num muted">–</td>` :
        `<td class="num" style="cursor:pointer;background:color-mix(in srgb,var(--red) ${Math.round(Math.min(1, v / 40) * 40)}%,transparent)" data-go="${esc(ids[i])}" data-area="${esc(a)}" data-tip="${v}% of complaints · opportunity ${b[a].opportunity}">${v}%</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
    $("#cmp").querySelectorAll("[data-go]").forEach(c => c.onclick = () => { state.topicDef = {topic: c.dataset.area}; state.filter = {}; openDataset(c.dataset.go, "topic"); });
    $("#cmp").querySelectorAll("[data-open]").forEach(c => c.onclick = () => openDataset(c.dataset.open));
  };
  $("#app").querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = draw);
  draw();
}
